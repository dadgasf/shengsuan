<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3d2b">
  <meta name="color-scheme" content="light">
  <meta name="description" content="省算：输入商品名，同时搜索淘宝/天猫、京东、拼多多，汇总相关商品和券后参考价，自动标出哪个平台更低。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="省算">
  <meta name="format-detection" content="telephone=no">
  <title>省算 · 淘宝京东拼多多比价</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="app-shell" id="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="省算首页">
        <span class="brand-mark" aria-hidden="true">省</span>
        <span class="brand-copy">
          <strong>省算</strong>
          <small>三平台比价</small>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" data-action="open-about" aria-label="关于省算与数据来源">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero search-hero" aria-labelledby="search-title">
        <div class="hero-head">
          <span class="eyebrow"><span class="eyebrow-dot"></span>淘宝 · 京东 · 拼多多</span>
          <span class="privacy-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="8"/></svg>
            实时搜索
          </span>
        </div>
        <h1 id="search-title">搜一件商品，<br>比三个平台。</h1>
        <p class="hero-sub">输入商品名，自动汇总淘宝/天猫、京东、拼多多的相关商品和券后参考价。</p>

        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="search-input">商品名称</label>
          <input
            class="search-input"
            id="search-input"
            name="q"
            type="search"
            inputmode="search"
            autocomplete="off"
            enterkeyhint="search"
            maxlength="60"
            placeholder="例如：iPhone 17 256G、机械键盘"
          >
          <button class="btn btn-lime search-submit" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            搜比价
          </button>
        </form>

        <div class="example-row" aria-label="示例搜索">
          <span>试试</span>
          <button type="button" data-example="iPhone 17 256G">iPhone 17 256G</button>
          <button type="button" data-example="机械键盘">机械键盘</button>
          <button type="button" data-example="洗衣液">洗衣液</button>
        </div>

        <div class="search-note" id="search-note">输入商品名开始。搜索的是公开索引价格，不是登录后的专属价。</div>
      </section>

      <section id="summary" class="summary" hidden aria-live="polite"></section>
      <section id="controls" class="controls" hidden aria-label="筛选和排序"></section>
      <section id="results" class="results" aria-live="polite"></section>

      <section class="source-note">
        <div class="source-note-icon">i</div>
        <div>
          <strong>关于价格和链接</strong>
          <p>搜索来自第三方公开比价索引，不是平台官方接口，价格可能延迟或混入不同 SKU。商品链接可能含推广参数；下单前请以商品页和结算页为准。</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>省算 · 不登录，不保存搜索记录到服务器</span>
      <button type="button" class="text-btn" data-action="open-about">数据与说明</button>
    </footer>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">省算需要 JavaScript 才能搜索和比价，请在浏览器设置中开启。</div>
  </noscript>

  <script src="search-engine.js"></script>
  <script src="search.js"></script>
</body>
</html>
